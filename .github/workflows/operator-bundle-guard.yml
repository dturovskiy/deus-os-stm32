name: Operator Bundle Guard
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-authoring-regressions:
    name: Bundle authoring tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile guard source
        run: python -m py_compile scripts/operator_bundle_guard/bundle_guard.py scripts/operator_bundle_guard/test_bundle_guard.py scripts/operator_bundle_guard/evidence_diagnostic_guard_v1.py scripts/operator_bundle_guard/test_evidence_diagnostic_guard_v1.py scripts/operator_bundle_guard/audit_writer_native_candidate_v1.py scripts/operator_bundle_guard/audit_writer_native_bundle_exact_v1.py scripts/operator_bundle_guard/audit_writer_native_original_v1.py scripts/operator_bundle_guard/test_audit_writer_native_original_v1.py
      - name: Execute fail-closed regression suite
        run: python -m unittest discover -s scripts/operator_bundle_guard -p 'test_*.py' -v
      - name: Reject incomplete or unpinned A-05 Windows wheelhouses (source-only)
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_windows_wheelhouse_source_v1.py' -v
      - name: Verify A-05 native accepted regular-wheel selection (off-Git Evidence optional)
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_windows_python314_regular_wheel_selection_v1.py' -v
      - name: Test A-05 constrained PyPI download without any network
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_wheel_download_source_v1.py' -v
      - name: Independently recheck A-05 owner Wheelhouse when off-Git original is available
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_original_wheelhouse_bytes_v1.py' -v
      - name: Test A-05 isolated CPython target source and fail-closed original adjudication
        run: |
          python -m unittest discover -s scripts/gate4_entry -p 'test_a05_isolated_cp314_deploy_source_v1.py' -v
          python -m unittest discover -s scripts/gate4_entry -p 'test_a05_isolated_cp314_original_v1.py' -v
      - name: Check genuine A-05 v2 Evidence and Windows target-tree ordering (when originals present)
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_isolated_cp314_original_v2.py' -v
      - name: Windows native PowerShell AST parse of A-05 isolated operator authoring source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'scripts/gate4_entry/apply_a05_cp314_isolated_deploy_v2_20261029.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error ("AST ID={0} LINE={1} COL={2} MESSAGE={3}" -f $_.ErrorId, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Output 'A05_ISOLATED_AUTHORING_SOURCE_WINDOWS_PWSH_AST=PASS'
      - name: A-05 isolated Windows controller deny-only source and synthetic FAIL Evidence
        run: |
          python -m unittest discover -s scripts/gate4_entry -p 'test_a05_isolated_controller_native_probe_source_v1.py' -v
          python -m unittest discover -s scripts/gate4_entry -p 'test_a05_controller_isolated_deny_auditor_v2.py' -v
          python scripts/gate4_entry/audit_a05_controller_ps_hashtable_keys_v1.py
      - name: Independently verify original A-05 controller deny-only Windows Evidence when off-Git bytes present
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_a05_controller_isolated_deny_original_v2.py' -v
      - name: Windows native AST parse of A-05 controller isolated deny-only operator source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = 'scripts/gate4_entry/apply_a05_controller_isolated_deny_v2_20261029.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error ("AST ID={0} LINE={1} COL={2} MESSAGE={3}" -f $_.ErrorId, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          }
          Write-Output 'A05_CONTROLLER_NATIVE_DENY_AUTHORING_SOURCE_WINDOWS_AST=PASS'
      - name: Audit RA-07 independently trusted execution boundary (source-only, no hardware)
        run: python -m unittest discover -s scripts/gate4_entry -p 'test_ra07_execution_trust_boundary_v1.py' -v
      - name: Assert no operator ZIP accidentally tracked in public repository
        shell: bash
        run: |
          if git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(stm32_os_.*\.zip|.*\.evidence\.zip)$'; then
            echo 'Public repo must not contain operator bundles or run evidence ZIPs' >&2
            exit 1
          fi
