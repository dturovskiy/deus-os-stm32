name: Host deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host Core and Transport
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: host
        shell: bash
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize isolated .NET and NuGet directories
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          mkdir -p "$RUNNER_TEMP/deus-dotnet-home" "$RUNNER_TEMP/deus-nuget-packages"
          {
            printf 'DOTNET_CLI_HOME=%s\n' "$RUNNER_TEMP/deus-dotnet-home"
            printf 'NUGET_PACKAGES=%s\n' "$RUNNER_TEMP/deus-nuget-packages"
          } >> "$GITHUB_ENV"

      - name: Setup .NET 10 from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: host/global.json
          cache: false

      - name: Verify SDK, MTP selection and environment
        run: |
          set -euo pipefail
          mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"
          dotnet --info
          command -v jq >/dev/null
          jq -e '.sdk.version == "10.0.100" and .sdk.rollForward == "latestFeature" and .sdk.allowPrerelease == false and .test.runner == "Microsoft.Testing.Platform"' global.json >/dev/null
          echo 'GLOBAL_JSON_SDK_AND_MTP=PASS'

      - name: Non-vacuous patch and tracked-file hygiene
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
          else
            echo 'UNAUTHORIZED_CI_EVENT' >&2
            exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "0000000000000000000000000000000000000000" ]] || { echo 'INVALID_PATCH_BASE' >&2; exit 1; }
          git cat-file -e "${base}^{commit}"
          changed="$(git diff --name-only "$base" HEAD)"
          [[ -n "$changed" ]] || { echo 'EMPTY_PATCH_RANGE' >&2; exit 1; }
          git diff --check "$base" HEAD
          # Self-contained product checkout, without private operator tooling.
          forbidden_re='(^|/)(build|bin|obj|TestResults|artifacts|coverage)/|\.(bin|elf|map|log|zip|7z|pfx|p12|pem|key|dpapi|pkg|nupkg|snupkg)$'
          shopt -s nocasematch
          for fixture in scratch/device.dpapi scratch/update.pkg build/example.elf host/example/bin/test.dll; do
            [[ "$fixture" =~ $forbidden_re ]] || { echo "FORBIDDEN_OUTPUT_NEGATIVE_TEST_FAILED=$fixture" >&2; exit 1; }
          done
          for fixture in .github/workflows/ci.yml docs/FIRMWARE_UPDATE_BOOTLOADER_PROTOCOL_V1.md scripts/create_firmware_update_package.ps1; do
            if [[ "$fixture" =~ $forbidden_re ]]; then
              echo "FORBIDDEN_OUTPUT_FALSE_POSITIVE=$fixture" >&2
              exit 1
            fi
          done
          for suffix in .dpapi .pkg; do
            git -C .. check-ignore --quiet --no-index "untracked-secret-fixture$suffix"
          done
          git -C .. ls-files -z > "$RUNNER_TEMP/deus-tracked-paths.nul"
          count=0
          found_workflow=0
          while IFS= read -r -d '' item; do
            ((count+=1))
            [[ "$item" != '.github/workflows/ci.yml' ]] || found_workflow=1
            if [[ "$item" =~ $forbidden_re ]]; then
              echo "FORBIDDEN_TRACKED_OUTPUT=$item" >&2
              exit 1
            fi
            case "$item" in
              *.py|scripts/bench/*|scripts/gate3_operator/*|scripts/gate4_entry/*|scripts/operator_bundle_guard/*)
                echo "INTERNAL_OPERATOR_TOOLING_TRACKED=$item" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/deus-tracked-paths.nul"
          [[ "$found_workflow" -eq 1 && "$count" -gt 0 ]] || { echo 'CI_WORKFLOW_NOT_TRACKED' >&2; exit 1; }
          echo 'FORBIDDEN_OUTPUT_NEGATIVE_FIXTURES=PASS'
          echo "TRACKED_OUTPUT_HYGIENE=PASS count=$count"
          echo 'NON_VACUOUS_PATCH_WHITESPACE=PASS'

      - name: Restore locked Host solution
        run: dotnet restore DeusOs.Control.sln --locked-mode --disable-parallel

      - name: Build Release Host solution
        run: dotnet build DeusOs.Control.sln --configuration Release --no-restore --warnaserror

      - name: Execute Core MTP tests (minimum 84)
        run: dotnet test --project tests/DeusOs.Control.Core.Tests/DeusOs.Control.Core.Tests.csproj --configuration Release --no-build --no-ansi --minimum-expected-tests 84

      - name: Execute Transport MTP tests (minimum 24)
        run: dotnet test --project tests/DeusOs.Control.Transport.Tests/DeusOs.Control.Transport.Tests.csproj --configuration Release --no-build --no-ansi --minimum-expected-tests 24
